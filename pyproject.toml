[project]
name = "ted-companion"
version = "1.0.0"
description = "Ted — Trợ lý đồng hành Deep Work & Pomodoro trên Desktop (PySide6) kết nối Não AI chuẩn OpenAI-compatible (Local / Cloud / VPS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "qasync>=0.27.1",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "httpx>=0.27.2",
    "fastmcp>=0.4.0",
    "tzdata>=2024.1",
    "PyYAML>=6.0",
    "matplotlib>=3.8",   # vẽ công thức toán (mathtext) trong chat & ôn tập
    "psycopg[binary]>=3.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ted-app = "src.main:main"
ted-mcp = "src.bridge.ted_mcp_server:run_mcp_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
